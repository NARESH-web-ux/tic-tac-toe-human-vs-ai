
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | Human vs AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Tic-Tac-Toe</h1>

        <p class="subtitle">
            Human <span>X</span> vs AI <span>O</span>
        </p>

        <p id="status">Your turn! Choose a square.</p>
        
<div class="scoreboard">
    <div class="score-card player-score">
        <span class="score-label">YOUR WINS</span>
        <span class="score-value" id="playerScore">0</span>
    </div>

    <div class="score-card ai-score">
        <span class="score-label">AI WINS</span>
        <span class="score-value" id="aiScore">0</span>
    </div>

    <div class="score-card draw-score">
        <span class="score-label">DRAWS</span>
        <span class="score-value" id="drawScore">0</span>
    </div>
</div>

        <div id="board">
            <button class="cell" data-index="0" aria-label="Square 1"></button>
            <button class="cell" data-index="1" aria-label="Square 2"></button>
            <button class="cell" data-index="2" aria-label="Square 3"></button>
            <button class="cell" data-index="3" aria-label="Square 4"></button>
            <button class="cell" data-index="4" aria-label="Square 5"></button>
            <button class="cell" data-index="5" aria-label="Square 6"></button>
            <button class="cell" data-index="6" aria-label="Square 7"></button>
            <button class="cell" data-index="7" aria-label="Square 8"></button>
            <button class="cell" data-index="8" aria-label="Square 9"></button>
        </div>

        <button id="restart">Restart Game</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
